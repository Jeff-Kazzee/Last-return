name: Repository guard

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Branch direction check
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        run: python3 scripts/check_branch_policy.py "$PR_HEAD" "$PR_BASE"
      - name: Validate policy script
        run: python3 -m py_compile scripts/check_branch_policy.py
      - name: Minimal project hygiene
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/GAME_DESIGN.md
          test -f docs/BRANCHING.md
          test -f docs/RELEASE_CHECKLIST.md
      - name: Godot import, if project exists
        shell: bash
        run: |
          if [ ! -f project.godot ]; then
            echo "No Godot project yet. Skipping engine import only."
            exit 0
          fi
          if ! command -v godot >/dev/null 2>&1; then
            echo "::warning::Godot binary unavailable on this runner. Project import NOT VERIFIED."
            exit 0
          fi
          godot --headless --editor --path . --import --quit
