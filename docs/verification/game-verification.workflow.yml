name: Game verification

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          mkdir -p .tools
          curl --fail --location --retry 2 --output .tools/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q .tools/godot.zip -d .tools
          mv .tools/Godot_v4.4.1-stable_linux.x86_64 .tools/godot
          chmod +x .tools/godot
          echo '54215149d52efb1d653a3dec39d0993587bdf5daa2c56e787b5ee88417fb1339  .tools/godot' | sha256sum --check
          .tools/godot --version
      - name: Formal lifecycle checker and negative control
        run: scripts/verify_formal.sh
      - name: Godot import and mechanics
        run: GODOT="$PWD/.tools/godot" scripts/verify_godot.sh
      - name: Input-driven application route
        run: GODOT="$PWD/.tools/godot" scripts/verify_live.sh
