<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>Last Return sandbox test</title>
    <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#111}</style>
  </head>
  <body>
    <iframe id="cabinet" sandbox="allow-scripts" src="/index.html"></iframe>
    <script>
      window.messages = [];
      window.addEventListener("message", (event) => {
        if (event.source !== document.getElementById("cabinet").contentWindow) return;
        window.messages.push(event.data);
        document.body.dataset.lastType = event.data?.type || "";
      });
    </script>
  </body>
</html>
